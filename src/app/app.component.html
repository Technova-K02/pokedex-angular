<mat-sidenav-container class="layout">
  <mat-sidenav
    class="sidenav"
    [mode]="'side'"
    [opened]="sidebarOpen()"
    [fixedInViewport]="true"
    [fixedTopGap]="56"
  >
    <div class="sidenav-header">
      <div class="brand">
        <span class="brand-mark">PK</span>
        <span class="brand-name">Trainer Dashboard</span>
      </div>
    </div>

    <mat-nav-list class="nav">
      @for (item of navItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="toolbar" color="primary">
      <button mat-icon-button type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Pokédex Trainer Dashboard</span>
      <span class="spacer"></span>
      <a mat-button routerLink="/profile">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </a>
    </mat-toolbar>

    <main class="main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
